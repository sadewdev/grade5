<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin LAB Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-['Poppins'] min-h-screen">

  <div class="max-w-6xl mx-auto p-4 sm:p-6">
    <!-- Header -->
    <header class="flex items-center justify-between pb-6 border-b border-slate-800 mb-6">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-amber-500/10 border border-amber-500/30 rounded-2xl text-amber-400 text-2xl">🔒</div>
        <div>
          <h1 class="text-2xl font-bold text-white">Next Level Admin LAB</h1>
          <p class="text-xs text-slate-400">Secure Central Database Management</p>
        </div>
      </div>
      <div id="authStatus" class="hidden flex items-center gap-4">
        <span id="userEmail" class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-full"></span>
        <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition">Logout</button>
      </div>
    </header>

    <!-- Login View -->
    <div id="loginSection" class="max-w-md mx-auto my-12 bg-slate-800/80 border border-slate-700 p-8 rounded-3xl shadow-2xl">
      <h2 class="text-xl font-bold text-white mb-2">Admin Security Gate</h2>
      <p class="text-slate-400 text-xs mb-6">Enter your Admin credentials to gain access.</p>

      <!-- Alert Box for Error Messages -->
      <div id="loginAlert" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-semibold"></div>

      <form id="adminLoginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Email Address</label>
          <input type="email" id="adminEmail" required placeholder="admin@domain.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Password</label>
          <input type="password" id="adminPassword" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <button type="submit" id="loginBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
          <span>Authenticate & Access</span>
        </button>
      </form>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardSection" class="hidden space-y-8">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-800/40 p-4 rounded-2xl border border-slate-800">
        <h2 class="text-lg font-bold text-slate-200">Database Questions Registry</h2>
        <button onclick="openQuestionModal()" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl transition flex items-center justify-center gap-2">
          <span>➕</span> Add New Question
        </button>
      </div>

      <div class="bg-slate-800/50 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-900/80 text-xs text-slate-400 uppercase border-b border-slate-800">
              <tr>
                <th class="p-4">ID</th>
                <th class="p-4">Level</th>
                <th class="p-4">Category</th>
                <th class="p-4">Question</th>
                <th class="p-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="questionsTableBody" class="divide-y divide-slate-800">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let supabaseClient = null;

    function showAlert(msg) {
      const alertBox = document.getElementById("loginAlert");
      alertBox.textContent = msg;
      alertBox.classList.remove("hidden");
    }

    function hideAlert() {
      document.getElementById("loginAlert").classList.add("hidden");
    }

    function initSupabase() {
      if (typeof CONFIG === 'undefined' || !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) {
        showAlert("Config Error: 'config.js' file is missing or CONFIG variables are invalid.");
        return false;
      }
      try {
        supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        return true;
      } catch (err) {
        showAlert("Supabase Init Failed: " + err.message);
        return false;
      }
    }

    async function checkAuth() {
      if (!supabaseClient && !initSupabase()) return;

      const { data: { session }, error } = await supabaseClient.auth.getSession();
      
      if (session) {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("dashboardSection").classList.remove("hidden");
        document.getElementById("authStatus").classList.remove("hidden");
        document.getElementById("userEmail").textContent = session.user.email;
        loadQuestions();
      } else {
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("dashboardSection").classList.add("hidden");
        document.getElementById("authStatus").classList.add("hidden");
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();

      if (!supabaseClient && !initSupabase()) return;

      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value.trim();
      const btn = document.getElementById("loginBtn");

      btn.disabled = true;
      btn.innerHTML = "<span>Authenticating... ⏳</span>";

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          showAlert("Login Error: " + error.message);
        } else {
          console.log("Logged in successfully:", data);
          await checkAuth();
        }
      } catch (err) {
        showAlert("Unexpected Error: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = "<span>Authenticate & Access</span>";
      }
    }

    async function handleLogout() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
        checkAuth();
      }
    }

    async function loadQuestions() {
      const tbody = document.getElementById("questionsTableBody");
      tbody.innerHTML = "<tr><td colspan='5' class='p-4 text-center text-slate-500'>Loading questions...</td></tr>";

      const { data, error } = await supabaseClient.from('questions').select('*').order('id', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan='5' class='p-4 text-center text-rose-500'>Error: ${error.message}</td></tr>`;
        return;
      }

      if (data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='5' class='p-4 text-center text-slate-500'>No questions found.</td></tr>";
        return;
      }

      tbody.innerHTML = "";
      data.forEach(q => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-800/80 transition";
        tr.innerHTML = `
          <td class="p-4 font-mono text-slate-400">#${q.id}</td>
          <td class="p-4 font-bold text-amber-400">L${q.level_id}</td>
          <td class="p-4 font-semibold text-slate-300">${q.category}</td>
          <td class="p-4 text-slate-200">${q.question.substring(0, 50)}...</td>
          <td class="p-4 text-right space-x-2">
            <button class="text-xs bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1.5 rounded-lg hover:bg-amber-500/20">Edit</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
    });
  </script>
</body>
</html>
